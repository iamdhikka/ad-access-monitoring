name: ad-access-monitoring

services:
  dc1:
    build: ./samba
    container_name: dc1
    hostname: dc1
    restart: unless-stopped
    environment:
      AD_HOSTNAME: dc1
      AD_REALM: ${AD_REALM}
      AD_DOMAIN: ${AD_DOMAIN}
      AD_ADMIN_PASSWORD: ${AD_ADMIN_PASSWORD}
    networks:
      lab:
        aliases: [dc1.corp.lab]
    ports:
      - "127.0.0.1:636:636"   # LDAPS hanya bisa diakses dari laptop sendiri
    volumes:
      - samba_data:/samba
      - tls:/tls
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/636'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  ad-simulator:
    build: ./tools
    container_name: ad-simulator
    restart: unless-stopped
    command: ["python", "simulate.py"]
    environment:
      AD_HOST: dc1.corp.lab
      AD_REALM: ${AD_REALM}
      AD_ADMIN_PASSWORD: ${AD_ADMIN_PASSWORD}
      AD_MONITOR_PASSWORD: ${AD_MONITOR_PASSWORD}
      SEED_USERS: ${SEED_USERS:-300}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-20}
    networks: [lab]
    volumes:
      - tls:/tls:ro
    depends_on:
      dc1:
        condition: service_healthy

  ad-exporter:
    build: ./tools
    container_name: ad-exporter
    restart: unless-stopped
    command: ["python", "exporter.py"]
    environment:
      AD_HOST: dc1.corp.lab
      AD_REALM: ${AD_REALM}
      AD_MONITOR_USER: svc-monitor
      AD_MONITOR_PASSWORD: ${AD_MONITOR_PASSWORD}
      POLL_INTERVAL_SECONDS: 30
      STALE_DAYS: 90
      PRIVILEGED_GROUPS: Domain Admins,Enterprise Admins,Schema Admins,Server-Admins
    networks: [lab]
    volumes:
      - tls:/tls:ro
    depends_on:
      dc1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ad-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks: [lab]
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ad-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    networks: [lab]
    ports:
      - "127.0.0.1:9094:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ad-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ad-access.json
    networks: [lab]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  lab:

volumes:
  samba_data:
  tls:
  prometheus_data:
  grafana_data:
